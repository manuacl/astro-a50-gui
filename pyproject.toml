[project]
name = "astro-a50-gui"
version = "0.6.2"
description = "PyQt6 GUI to configure the Astro A50 Gen 4 wireless headset from Linux."
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "vendor/LICENSE.txt", "icons/LICENSE-lucide.txt"]

[tool.ruff.lint]
# BLE001 (blind `except Exception`): deliberate in this codebase — device
# I/O and Qt slots must never propagate; failures are shown as dialogs or
# degraded to None (see gui.py, eq_widget.py, status_worker.py).
ignore = ["BLE001"]
